# PLIK POGLADOWY. Na klastrze run_lan.sh GENERUJE wlasny conf per rozmiar klastra
# ($HOME/conf-nN.properties) z faktycznie przydzielonych wezlow SLURM - tego pliku nie uzywa.
#
# Liczba serwerow = liczba wpisow na liscie (dowolne N; nieparzyste lepsze dla Raft).
# peer_index podawany CounterServerowi = POZYCJA adresu na liscie (0-based).
# TEN SAM plik musi byc widoczny na wszystkich wezlach (serwery + klient) - ta sama lista peerow.
raft.server.address.list=dcc-1:10024,dcc-2:10024,dcc-3:10024

# UWAGA: CounterServer i tak tworzy storage jako ./<id> wzgledem katalogu roboczego (CWD),
# a nie z tego klucza. Storage kontrolujesz przez CWD (patrz run_lan.sh: cd do /data/...).
# Ten klucz zostawiamy informacyjnie:
# raft.server.root.storage.path=/data/<subdir>/raft

# Opcjonalne (dlugosc list MUSI byc rowna liczbie adresow):
# raft.server.priority.list=1,0,0
# raft.server.simulated-slowness.list=0,0,0
