# Konfiguracja dla środowiska Docker
MODE=docker

COMPOSE_FILE="docker/docker-compose.yml"
JAR="/app/ratis-examples.jar"
CLIENT_CLASS="org.apache.ratis.examples.counter.client.CounterClient"

# Węzły klastra
NODES=(n0 n1 n2)

# Funkcja wykonania komendy na węźle
node_exec() {
    local node=$1; shift
    docker compose -f "$COMPOSE_FILE" exec -T "$node" "$@"
}

# Funkcja wykonania komendy na kliencie
client_exec() {
    docker compose -f "$COMPOSE_FILE" exec -T client "$@"
}

# Pobranie logów
get_logs() {
    docker compose -f "$COMPOSE_FILE" logs n0 n1 n2 2>/dev/null
}
