# Konfiguracja dla prawdziwych maszyn Linux
MODE=linux

SSH_USER=student
SERVER_0=192.168.1.10
SERVER_1=192.168.1.11
SERVER_2=192.168.1.12
CLIENT_HOST=192.168.1.20   # zostaw puste jeśli klient działa lokalnie

JAR="~/ratis-examples.jar"
CLIENT_CLASS="org.apache.ratis.examples.counter.client.CounterClient"

NODES=(0 1 2)
NODE_IPS=("$SERVER_0" "$SERVER_1" "$SERVER_2")

node_exec() {
    local node=$1; shift
    local ip="${NODE_IPS[$node]}"
    ssh "$SSH_USER@$ip" "$@"
}

client_exec() {
    if [ -n "$CLIENT_HOST" ]; then
        ssh "$SSH_USER@$CLIENT_HOST" "$@"
    else
        "$@"
    fi
}

get_logs() {
    for ip in "${NODE_IPS[@]}"; do
        ssh "$SSH_USER@$ip" "journalctl -u raft-server --no-pager -n 100" 2>/dev/null
    done
}
