name: zizmor

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - '**'
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.y*ml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.y*ml'

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || case(github.repository_owner == 'apache', github.sha, github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.repository_owner != 'apache' }}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
    - name: Checkout project
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      with:
        advanced-security: ${{ github.repository_owner == 'apache' && github.event_name == 'push' }}
