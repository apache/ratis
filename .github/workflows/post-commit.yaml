name: build-branch

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - '**'
    paths-ignore:
      # ignore files/dirs irrelevant for CI
      - '.asf.yaml'
      - '.gitignore'
      - '.idea'
      - 'LICENSE'
      - 'NOTICE'
      - '**.md'
      - '**.txt'
      - '!ratis-test/src/test/resources/ssl/asf_header.txt'
      # ignore .github except this workflow and the ones used transitively
      - '.github/**'
      - '!.github/workflows/post-commit.yaml'
      - '!.github/workflows/ci.yaml'
      - '!.github/workflows/check.yaml'
  pull_request:
    paths-ignore:
      # ignore files/dirs irrelevant for CI
      - '.asf.yaml'
      - '.gitignore'
      - '.idea'
      - 'LICENSE'
      - 'NOTICE'
      - '**.md'
      - '**.txt'
      - '!ratis-test/src/test/resources/ssl/asf_header.txt'
      # ignore .github except this workflow and the ones used transitively
      - '.github/**'
      - '!.github/workflows/post-commit.yaml'
      - '!.github/workflows/ci.yaml'
      - '!.github/workflows/check.yaml'

concurrency:
  group: ci-${{ github.event.pull_request.number || case(github.repository == 'apache/ratis', github.sha, github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.repository != 'apache/ratis' }}

permissions: { }

jobs:
  CI:
    if: github.event_name == 'pull_request'
      || github.repository == 'apache/ratis'
      || github.ref_name != 'master'
    uses: $/.github/workflows/ci.yaml
    secrets:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      SONARCLOUD_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
